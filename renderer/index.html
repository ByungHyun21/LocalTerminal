<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'">
  <title>LocalTerminal</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-header">
          <div class="lang-wrap">
            <button id="btnLang" class="lang-btn" data-i18n-title="lang.title" title="Language">
              <img id="langFlag" src="flags/kr.svg" alt="">
              <span class="lang-caret">▾</span>
            </button>
            <div id="langMenu" class="lang-menu" hidden>
              <button type="button" data-lang="en"><img src="flags/us.svg" alt="">English</button>
              <button type="button" data-lang="ko"><img src="flags/kr.svg" alt="">한국어</button>
              <button type="button" data-lang="ja"><img src="flags/jp.svg" alt="">日本語</button>
              <button type="button" data-lang="zh"><img src="flags/cn.svg" alt="">中文</button>
            </div>
          </div>
          <span data-i18n="sidebar.title">SSH 세션</span>
          <button id="btnNew" class="icon-btn" data-i18n-title="sidebar.new" title="새 세션 추가">＋</button>
        </div>
        <ul id="sessionList"></ul>
        <div class="sidebar-footer">
          <button id="btnHideSidebar" class="sidebar-toggle" data-i18n="sidebar.hide">« 세션 목록 숨기기</button>
        </div>
      </div>
    </aside>

    <main id="main">
      <div id="toolbar">
        <div id="status">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">연결 없음</span>
        </div>
        <div class="spacer"></div>
        <label class="tool-group"><span data-i18n="toolbar.theme">테마</span>
          <select id="themeSelect"></select>
        </label>
        <div class="tool-group font-group">
          <button id="fontMinus" class="icon-btn" data-i18n-title="toolbar.fontMinus" title="글자 작게 (Ctrl + -)">A−</button>
          <span id="fontSizeLabel" data-i18n-title="toolbar.fontSize" title="글자 크기">14</span>
          <button id="fontPlus" class="icon-btn" data-i18n-title="toolbar.fontPlus" title="글자 크게 (Ctrl + =)">A＋</button>
        </div>
        <button id="btnDisconnect" class="danger-btn" data-i18n="toolbar.disconnect" hidden>활성 창 연결 끊기</button>
      </div>

      <div id="paneArea">
        <div id="panes"></div>
        <div id="overlay" class="overlay">
        <button id="btnShowSidebar" class="show-sidebar-btn" data-i18n-title="sidebar.show" title="세션 목록 보이기" hidden>»</button>
          <div class="overlay-card">
            <h2 id="overlayTitle">LocalTerminal</h2>
            <p id="overlayMsg">왼쪽에서 세션을 <b>더블클릭</b>하면 활성 창에 연결됩니다.<br>활성 창이 사용 중이면 <b>오른쪽에 새 창</b>을 만들어 연결합니다.</p>
        </div>
      </div>
      </div>
    </main>
  </div>

  <div id="dialogBackdrop" class="backdrop" hidden>
    <form id="sessionForm" class="dialog">
      <h2 id="dialogTitle" data-i18n="dialog.new">새 세션</h2>

      <label><span data-i18n="dialog.name">이름</span> <input name="name" data-i18n-ph="dialog.namePh" placeholder="내 서버" autocomplete="off"></label>

      <div class="row">
        <label class="grow"><span data-i18n="dialog.host">호스트 *</span> <input name="host" required data-i18n-ph="dialog.hostPh" placeholder="192.168.0.10" autocomplete="off"></label>
        <label class="port"><span data-i18n="dialog.port">포트</span> <input name="port" type="number" min="1" max="65535" value="22"></label>
      </div>

      <label><span data-i18n="dialog.user">사용자 *</span> <input name="username" required data-i18n-ph="dialog.userPh" placeholder="root" autocomplete="off"></label>

      <label><span data-i18n="dialog.auth">인증 방식</span>
        <select name="authMethod" id="authMethod">
          <option value="password" data-i18n="dialog.authPassword">비밀번호</option>
          <option value="key" data-i18n="dialog.authKey">개인 키</option>
        </select>
      </label>

      <label id="passwordField"><span data-i18n="dialog.password">비밀번호 *</span><input name="password" type="password" autocomplete="new-password"></label>

      <div id="keyFields" hidden>
        <div class="row">
          <label class="grow"><span data-i18n="dialog.keyFile">키 파일 *</span> <input name="keyPath" data-i18n-ph="dialog.keyFilePh" placeholder="C:\Users\me\.ssh\id_rsa" autocomplete="off"></label>
          <button type="button" id="btnBrowse" data-i18n="dialog.browse">찾아보기</button>
        </div>
        <label><span data-i18n="dialog.passphrase">패스프레이즈</span> <input name="passphrase" type="password" data-i18n-ph="dialog.passphrasePh" placeholder="없으면 비워 두세요" autocomplete="new-password"></label>
      </div>

      <div class="dialog-actions">
        <button type="button" id="btnCancel" class="ghost-btn" data-i18n="dialog.cancel">취소</button>
        <button type="submit" class="primary-btn" data-i18n="dialog.save">저장</button>
      </div>
    </form>
  </div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
