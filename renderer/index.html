<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>LocalTerminal</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span>SSH 세션</span>
        <button id="btnNew" class="icon-btn" title="새 세션 추가">＋</button>
      </div>
      <ul id="sessionList"></ul>
    </aside>

    <main id="main">
      <div id="toolbar">
        <div id="status">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">연결 없음</span>
        </div>
        <div class="spacer"></div>
        <label class="tool-group">테마
          <select id="themeSelect"></select>
        </label>
        <div class="tool-group font-group">
          <button id="fontMinus" class="icon-btn" title="글자 작게 (Ctrl + -)">A−</button>
          <span id="fontSizeLabel" title="글자 크기">14</span>
          <button id="fontPlus" class="icon-btn" title="글자 크게 (Ctrl + =)">A＋</button>
        </div>
        <button id="btnDisconnect" class="danger-btn" hidden>활성 창 연결 끊기</button>
      </div>

      <div id="paneArea">
        <div id="panes"></div>
        <div id="overlay" class="overlay">
          <div class="overlay-card">
            <h2 id="overlayTitle">LocalTerminal</h2>
            <p id="overlayMsg">왼쪽에서 세션을 <b>더블클릭</b>하면 활성 창에 연결됩니다.<br>활성 창이 사용 중이면 <b>오른쪽에 새 창</b>을 만들어 연결합니다.</p>
            <p id="overlayHint" class="muted">창 헤더의 ⊞ 버튼으로 오른쪽/아래 분할 — 2x2 그리드 등 자유 배치. 스플리터를 드래그해 크기 조절. Alt+방향키로 창 전환.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="dialogBackdrop" class="backdrop" hidden>
    <form id="sessionForm" class="dialog">
      <h2 id="dialogTitle">새 세션</h2>

      <label>이름 <input name="name" placeholder="내 서버" autocomplete="off"></label>

      <div class="row">
        <label class="grow">호스트 * <input name="host" required placeholder="192.168.0.10" autocomplete="off"></label>
        <label class="port">포트 <input name="port" type="number" min="1" max="65535" value="22"></label>
      </div>

      <label>사용자 * <input name="username" required placeholder="root" autocomplete="off"></label>

      <label>인증 방식
        <select name="authMethod" id="authMethod">
          <option value="password">비밀번호</option>
          <option value="key">개인 키</option>
        </select>
      </label>

      <label id="passwordField"><span>비밀번호 *</span><input name="password" type="password" autocomplete="new-password"></label>

      <div id="keyFields" hidden>
        <div class="row">
          <label class="grow">키 파일 * <input name="keyPath" placeholder="C:\Users\me\.ssh\id_rsa" autocomplete="off"></label>
          <button type="button" id="btnBrowse">찾아보기</button>
        </div>
        <label>패스프레이즈 <input name="passphrase" type="password" autocomplete="new-password" placeholder="없으면 비워 두세요"></label>
      </div>

      <div class="dialog-actions">
        <button type="button" id="btnCancel" class="ghost-btn">취소</button>
        <button type="submit" class="primary-btn">저장</button>
      </div>
    </form>
  </div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
